site_name: TAQ Suite Documentation
site_description: High-performance data pipelines, backtesting, and research tools for TAQ data.
theme:
  name: material
  palette:
    # Adds a dark mode / light mode toggle!
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The plugins section turns on the auto-doc generator
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src] # Change this if your code isn't in a 'src' folder

# This builds your left-hand navigation sidebar
nav:
  - Home: index.md
  - For Researchers (TaqClient):
      - Getting Started: client/getting_started.md
      - API Reference: client/api.md
  - For Developers (Architecture):
      - TAQ ETL: dev/etl.md
      - Backtester: dev/backtester.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences